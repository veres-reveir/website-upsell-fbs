<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile Preview — Future Business Summit</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #120a14;
      font-family: system-ui, sans-serif;
      color: rgba(255, 245, 235, 0.7);
    }
    h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .phone {
      width: 390px;
      height: min(844px, calc(100vh - 72px));
      border-radius: 32px;
      overflow: hidden;
      background: #000;
      box-shadow:
        0 0 0 2px #3a2a40,
        0 0 0 6px #1a1018,
        0 28px 80px rgba(0, 0, 0, 0.55);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      /* Force mobile layout inside the frame */
      background: #0a0608;
    }
    a {
      color: #e0b87a;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>Mobile preview · 390×844</h1>
  <div class="phone">
    <iframe src="./index.html" title="FBS mobile preview"></iframe>
  </div>
  <a href="./index.html">Open full desktop page instead</a>
</body>
</html>
